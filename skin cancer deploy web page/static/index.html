<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Prediction</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; color: #111; }
      .card { max-width: 640px; padding: 1.25rem; border: 1px solid #e5e7eb; border-radius: 12px; }
      .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
      .preview { width: 224px; height: 224px; object-fit: cover; border-radius: 8px; border: 1px solid #e5e7eb; }
      button { background: #111827; color: #fff; border: none; padding: .65rem 1rem; border-radius: 8px; cursor: pointer; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .muted { color: #6b7280; font-size: .9rem; }
      .result { margin-top: .75rem; font-weight: 600; }
      .error { color: #b91c1c; }
      input[type="file"] { display: none; }
      label.file { background: #f3f4f6; border: 1px dashed #d1d5db; padding: .75rem 1rem; border-radius: 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Image Prediction</h2>
      <p class="muted">Upload an image to get a prediction from your PyTorch model.</p>

      <div class="row" style="margin-top: 1rem;">
        <img id="preview" class="preview" src="" alt="Preview" hidden />

        <div>
          <label class="file">
            <input id="file-input" type="file" accept="image/*" />
            Choose image...
          </label>
          <div style="margin-top: .75rem;">
            <button id="predict-btn" disabled>Predict</button>
          </div>
          <div id="status" class="muted" style="margin-top: .5rem;"></div>
          <div id="result" class="result"></div>
        </div>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById('file-input');
      const predictBtn = document.getElementById('predict-btn');
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const previewEl = document.getElementById('preview');

      let selectedFile = null;

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        selectedFile = file || null;
        resultEl.textContent = '';
        statusEl.textContent = '';
        if (file) {
          const url = URL.createObjectURL(file);
          previewEl.src = url;
          previewEl.hidden = false;
          predictBtn.disabled = false;
        } else {
          previewEl.hidden = true;
          predictBtn.disabled = true;
        }
      });

      predictBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        predictBtn.disabled = true;
        statusEl.textContent = 'Predicting...';
        resultEl.textContent = '';

        const form = new FormData();
        form.append('image', selectedFile);

        try {
          const res = await fetch('/predict', { method: 'POST', body: form });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Request failed');
          const label = data.label ? `, label: ${data.label}` : '';
          resultEl.textContent = `Predicted index: ${data.predicted_index}${label} (confidence: ${data.confidence.toFixed(3)})`;
          statusEl.textContent = '';
        } catch (err) {
          resultEl.innerHTML = `<span class="error">${err.message}</span>`;
          statusEl.textContent = '';
        } finally {
          predictBtn.disabled = !selectedFile;
        }
      });
    </script>
  </body>
  </html>
